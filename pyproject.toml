[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "core-v3"
version = "3.0.0"
description = "Core V3.0 — Корпоративный аудит"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Проприетарная. Все права защищены." }
authors = [
    { name = "Сильченко Алексей" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Operating System :: Microsoft :: Windows",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Office/Business",
]

dependencies = [
    "PyQt6>=6.11",
    "pandas",
    "openpyxl",
    "qrcode[pil]",
    "qtwebview2>=0.6.0rc10",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
]
win = [
    "pywin32",
    "xlrd>=2.0.1",
]

[project.scripts]
core = "main:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "ui*", "ml*", "utils*"]
exclude = ["tests*", "Готовые*", "Logs*", "temp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"